    <circle r="76" fill="none" stroke="#ffcf66" stroke-width="2" stroke-dasharray="8 10" opacity=".75"/>
    <circle r="54" fill="none" stroke="#ff7f6e" stroke-width="2" opacity=".72"/>
    <circle r="32" fill="none" stroke="#78dce8" stroke-width="2" opacity=".72"/>
    <circle r="8" fill="#f7f3d0"/>
