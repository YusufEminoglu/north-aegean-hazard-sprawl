<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">North Aegean Hazard-Sprawl</title>
  <desc id="desc">An abstract coastal terrain crossed by urban growth and four hazard signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset=".55" stop-color="#123f50"/>
      <stop offset="1" stop-color="#0e6b69"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#50c9a8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#d9f99d" stop-opacity=".42"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bce8e3" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M620 306C691 272 691 217 757 203c69-14 84 25 149-7 55-27 65-84 125-105 54-19 105 1 169-41v270H620Z" fill="url(#land)"/>
