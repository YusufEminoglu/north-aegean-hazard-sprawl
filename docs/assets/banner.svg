    <path d="M620 318c91-37 92-79 157-99 78-24 101 17 158-15 56-31 69-77 116-95 56-22 94-7 149-33"/>
    <path d="M703 320c66-37 64-67 119-81 64-16 87 16 138-13 47-27 56-64 104-80 48-17 88-4 136-28"/>
  </g>
  <g transform="translate(970 154)">
