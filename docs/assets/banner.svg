    <text x="64" y="93" font-size="18" letter-spacing="5" fill="#79e2cb">OPEN RESEARCH COMPANION</text>
    <text x="64" y="157" font-size="48" font-weight="750">North Aegean</text>
    <text x="64" y="210" font-size="48" font-weight="750">Hazard–Sprawl</text>
