name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install numpy==2.4.6 PyYAML==6.0.3
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Verify AHP matrix
        run: python scripts/verify_ahp.py
      - name: Validate metadata and local links
        run: python scripts/validate_metadata.py
      - name: Run publication safety audit
        run: python scripts/publication_audit.py
