name: deploy-project-site

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "figures/png/**"
      - "CITATION.cff"
      - ".zenodo.json"
      - "LICENSE*"
      - "NOTICE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/figures
          cp -R docs/. _site/
          cp -R figures/png _site/figures/
          cp CITATION.cff .zenodo.json LICENSE LICENSE-docs NOTICE.md _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
